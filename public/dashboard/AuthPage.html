<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Basic Auth Protected Page</title>
  <link rel="stylesheet" href="/assets/css/app.css">
</head>
<body>
  <div style="min-height:100vh;display:grid;place-items:center;padding:24px">
    <div class="card" style="max-width:520px;width:100%;text-align:center">
      <div class="card-body" style="padding:36px">
        <div class="brand-mark" style="margin:0 auto 14px;width:44px;height:44px">AR</div>
        <h2 id="auth-title" style="color:var(--success)">Congratulations!</h2>
        <p id="auth-message">You have successfully logged in with HTTP Basic Authentication.</p>
        <p class="muted small">Credentials: <code>admin</code> / <code>admin</code></p>
        <a class="btn btn-secondary mt-1" href="/home.html" id="backHome">Back to the app</a>
      </div>
    </div>
  </div>
</body>
</html>
