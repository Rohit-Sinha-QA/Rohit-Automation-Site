<!DOCTYPE html>
<html>
<head>
    <title>Sign Up</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../indexStyle.css" />
    <link rel="icon" type="image/png" href="../icon.jpg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <div class="login-header">
                <h2>Welcome To Automation With Rohit</h2>
                <p style="font-size: 12px; color: rgb(139, 155, 176);">All-In-One place for Automation Practice</p>
            </div>
            <form id="signupForm">
                <div class="input-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email" required autocomplete="off">
                </div>
                <div class="input-group password-container">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password" required autocomplete="off">
                    <span id="togglePassword" class="toggle-icon">&#128065;</span>
                </div>
                <div class="input-group password-container">
                    <label for="confirmPassword">Re-enter Password</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Re-enter your password" required autocomplete="off">
                    <span id="toggleConfirmPassword" class="toggle-icon">&#128065;</span>
                </div>
                <button type="submit" class="login-button">Create Account</button>
            </form>
            <div class="register-link">
                <p>Back to Login Page <a href="../index.html">Click Here!</a></p>
            </div>
            <div class="social-login">
                <p class="or-text">Or sign in with</p>
                <div class="social-icons">
                    <a href="#" class="social-icon google-icon">G</a>
                    <a href="#" class="social-icon facebook-icon">f</a>
                    <a href="#" class="social-icon apple-icon">X</a>
                </div>
            </div>
        </div>
    </div>
    <script src="signupScript.js" defer></script>
</body>
</html>
