<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="../icon.jpg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <title>Contact Us</title>
    <style>
        body {
            display: flex;
            align-items: flex-start;
            justify-content: center;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            line-height: 1.6;
            min-height: 100vh;
            background:
                radial-gradient(circle at 12% 8%, rgba(57, 255, 143, 0.06), transparent 40%),
                radial-gradient(circle at 88% 92%, rgba(79, 209, 255, 0.05), transparent 40%),
                #05070a;
            margin: 0;
            color: #e6edf3;
        }
        header {
            width: 100%;
            background: #0a0e14;
            color: #e6edf3;
            padding: 16px 40px;
            position: absolute;
            top: 0;
            left: 0;
            border-bottom: 1px solid #1f2b38;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
        }
        header h1 {
            font-size: 17px;
            font-weight: 700;
            letter-spacing: -0.01em;
            font-family: 'JetBrains Mono', monospace;
            margin: 0;
        }
        header h1::before {
            content: "> ";
            color: #39ff8f;
        }
        main {
            max-width: 640px;
            width: 100%;
            margin: 120px auto 80px;
            background: #0f141b;
            border: 1px solid #1f2b38;
            padding: 40px 48px;
            border-radius: 12px;
            box-shadow: 0 1px 0 rgba(255,255,255,0.03) inset, 0 24px 64px -24px rgba(0, 0, 0, 0.7);
        }
        main h2 {
            font-size: 17px;
            font-weight: 700;
            letter-spacing: -0.01em;
            color: #e6edf3;
            font-family: 'JetBrains Mono', monospace;
            margin: 0 0 10px;
        }
        p {
            margin-bottom: 15px;
            color: #8b9bb0;
            font-size: 15px;
        }
        form {
            display: flex;
            flex-direction: column;
        }
        label {
            margin-top: 14px;
            font-size: 12px;
            font-weight: 600;
            color: #8b9bb0;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            font-family: 'JetBrains Mono', monospace;
        }
        input, textarea {
            padding: 10px 12px;
            margin-top: 6px;
            border: 1px solid #1f2b38;
            border-radius: 8px;
            resize: vertical;
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px;
            background: #0a0e14;
            color: #e6edf3;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: #39ff8f;
            background: #131a23;
            box-shadow: 0 0 0 3px rgba(57, 255, 143, 0.16);
        }
        button {
            margin-top: 22px;
            padding: 11px 18px;
            background: #39ff8f;
            color: #04140a;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 700;
            font-family: 'JetBrains Mono', monospace;
            cursor: pointer;
            transition: background 0.15s ease, box-shadow 0.15s ease;
        }
        button:hover {
            background: #5dffa6;
            box-shadow: 0 0 24px rgba(57, 255, 143, 0.16);
        }
        main a {
            color: #4fd1ff;
            text-decoration: none;
            font-weight: 500;
        }
        main a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <header>
        <h1>Contact Us</h1>
    </header>
    <main>
        <h2>Get in Touch</h2>
        <p>We'd love to hear from you! Please fill out the form below to get in touch with us.</p>

        <form action="mailto:rohitautomation@gmail.com" method="post" enctype="text/plain">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <label for="subject">Subject:</label>
            <input type="text" id="subject" name="subject" required>

            <label for="message">Message:</label>
            <textarea id="message" name="message" rows="5" required></textarea>

            <button type="submit">Send Message</button>
        </form>

        <p>You can also reach me directly at: <a href="mailto:mail2sinharohit@gmail.com">mail2sinharohit@gmail.com</a></p>
        <!-- <p>&copy; 2025 https://rohit-automation.netlify.app/</p> -->
    </main>
</body>
</html>
